  <path d="M 60 240 Q 300 290 600 240 T 1140 240" stroke="#a8c93a" stroke-width="1.5" fill="none" opacity="0.1"/>

  <circle cx="200" cy="150" r="3" fill="#f4e04d" opacity="0.4"/>
